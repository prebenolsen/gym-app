<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weak — offline</title>
    <meta name="theme-color" content="#F3F0ED" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background-color: #f3f0ed;
        color: #3d3d3d;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 24px;
        text-align: center;
      }
      img {
        width: min(58vw, 240px);
        height: auto;
      }
      p {
        margin: 0;
        color: #6b7280;
        max-width: 28ch;
      }
      button {
        border: none;
        background-color: #c65a1e;
        color: #ffffff;
        border-radius: 12px;
        padding: 12px 24px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        background-color: #9c4115;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/logo.svg" alt="Weak" />
      <p>You are offline. Your workouts sync once you are back on a connection.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
